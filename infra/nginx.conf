# Put this snippet inside the existing HTTPS server block for www.scu-gpt.top.
# It preserves the current host-level Nginx and only adds the /labelhub subpath.

location = /labelhub {
  return 301 /labelhub/;
}

location /labelhub/api/ {
  client_max_body_size 64m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /labelhub;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  proxy_pass http://127.0.0.1:8080/api/;
}

location = /labelhub/swagger-ui.html {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /labelhub;
  proxy_pass http://127.0.0.1:8080/swagger-ui.html;
}

location /labelhub/swagger-ui/ {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Prefix /labelhub;
  proxy_pass http://127.0.0.1:8080/swagger-ui/;
}

location = /labelhub/v3/api-docs {
  proxy_http_version 1.1;
