server:
  port: ${LABELHUB_BACKEND_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: labelhub-backend
  datasource:
    url: ${LABELHUB_DB_URL:jdbc:mysql://127.0.0.1:3306/labelhub?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${LABELHUB_DB_USERNAME:root}
    password: ${LABELHUB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  data:
    redis:
      host: ${LABELHUB_REDIS_HOST:127.0.0.1}
      port: ${LABELHUB_REDIS_PORT:6379}
      password: ${LABELHUB_REDIS_PASSWORD:}
      timeout: ${LABELHUB_REDIS_TIMEOUT:3s}
  mail:
    host: ${LABELHUB_MAIL_HOST:smtp.qq.com}
    port: ${LABELHUB_MAIL_PORT:465}
    username: ${LABELHUB_MAIL_USERNAME:}
    password: ${LABELHUB_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${LABELHUB_MAIL_SSL_ENABLED:true}
          starttls:
            enable: ${LABELHUB_MAIL_STARTTLS_ENABLED:false}

labelhub:
  prompts:
    dir: ${LABELHUB_PROMPTS_DIR:agent/prompts}
  auth:
    token-ttl-seconds: ${LABELHUB_AUTH_TOKEN_TTL_SECONDS:7200}
    cors:
      allowed-origin-patterns: ${LABELHUB_AUTH_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*],http://172.16.*:[*],http://172.17.*:[*],http://172.18.*:[*],http://172.19.*:[*],http://172.2*.*:[*],http://172.30.*:[*],http://172.31.*:[*]}
    service-login-token: ${LABELHUB_AUTH_SERVICE_LOGIN_TOKEN:labelhub-local-service-login-token}
    turnstile:
      secret-key: ${LABELHUB_AUTH_TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
      siteverify-url: ${LABELHUB_AUTH_TURNSTILE_SITEVERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
      timeout-ms: ${LABELHUB_AUTH_TURNSTILE_TIMEOUT_MS:5000}
    password-reset:
      code-ttl-seconds: ${LABELHUB_AUTH_PASSWORD_RESET_CODE_TTL_SECONDS:600}
      resend-cooldown-seconds: ${LABELHUB_AUTH_PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:60}
      max-attempts: ${LABELHUB_AUTH_PASSWORD_RESET_MAX_ATTEMPTS:5}
      mail-from: ${LABELHUB_MAIL_FROM:${LABELHUB_MAIL_USERNAME:}}
    demo-users:
      enabled: ${LABELHUB_DEMO_USERS_ENABLED:true}
      owner-password: ${LABELHUB_DEMO_OWNER_PASSWORD:owner123}
      labeler-password: ${LABELHUB_DEMO_LABELER_PASSWORD:labeler123}
      reviewer-password: ${LABELHUB_DEMO_REVIEWER_PASSWORD:reviewer123}
      ai-reviewer-password: ${LABELHUB_DEMO_AI_REVIEWER_PASSWORD:ai_reviewer123}
      system-agent-password: ${LABELHUB_DEMO_SYSTEM_AGENT_PASSWORD:agent123}
      all-roles-password: ${LABELHUB_DEMO_ALL_ROLES_PASSWORD:demo123}
    initial-owner:
      enabled: ${LABELHUB_INITIAL_OWNER_ENABLED:false}
      username: ${LABELHUB_INITIAL_OWNER_USERNAME:}
      display-name: ${LABELHUB_INITIAL_OWNER_DISPLAY_NAME:Owner}
      password: ${LABELHUB_INITIAL_OWNER_PASSWORD:}
    system-agent:
      enabled: ${LABELHUB_SYSTEM_AGENT_ENABLED:false}
      username: ${LABELHUB_SYSTEM_AGENT_USERNAME:system_agent}
      display-name: ${LABELHUB_SYSTEM_AGENT_DISPLAY_NAME:System Agent}
      password: ${LABELHUB_SYSTEM_AGENT_PASSWORD:}
  model-config:
    secret: ${LABELHUB_MODEL_CONFIG_SECRET:}
  export:
    storage-dir: ${LABELHUB_EXPORT_STORAGE_DIR:data/exports}
  attachments:
    storage-dir: ${LABELHUB_ATTACHMENTS_STORAGE_DIR:data/attachments}
